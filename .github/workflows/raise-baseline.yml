name: Raise the package validation baseline

# After Publish packages pushes a stable version, waits for nuget.org to list it, then opens a draft pull request that
# raises PackageValidationBaselineVersion to it (ADR-1007, ADR-1001) and starts CI on its branch, because a pull request
# the workflow's token opens starts no workflow by itself. A person marks it ready and merges it. Needs Settings >
# Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests". To raise the
# baseline by hand, run build/Update-Baseline.ps1 -Version <version>, or this workflow for a tag. The checkout keeps no
# credential.
#
# publish.yml calls this workflow as a job after the push. It is not started by workflow_run: tag-release.yml starts
# publish.yml with the workflow's GITHUB_TOKEN, and GitHub creates no workflow_run event for a run started that way
# (ADR-1008).

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose version is the new baseline, such as v5.0.2
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose version is the new baseline, such as v5.0.2
        required: true
        type: string

permissions: {}

jobs:
  raise:
    name: Open the baseline pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: raise-baseline
      cancel-in-progress: false
    permissions:
      # To push the branch.
      contents: write
      # To open the pull request.
      pull-requests: write
      # To start CI on the branch.
      actions: write
    steps:
      # The tag reaches the script through env, and only after it is known to be a version, so it can't inject anything.
      - name: Read the tag
        id: tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag '$env:TAG' isn't a stable version such as v5.0.2." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Raise the baseline
        id: baseline
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $set = ./build/Update-Baseline.ps1 -Version $env:VERSION
          "set=$([bool]$set)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Open the pull request and start CI
        if: steps.baseline.outputs.set == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $branch = "baseline-$env:VERSION"
          git ls-remote --exit-code --heads origin $branch *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$branch already exists; nothing to open."; exit 0 }
          if ($LASTEXITCODE -ne 2) { throw "git ls-remote failed with exit code $LASTEXITCODE." }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git commit -am "Raise the package validation baseline to $env:VERSION"
          # The checkout keeps no credential (it would stay in .git/config for later steps); the push gets it for this one command.
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin $branch
          gh pr create --draft --base $env:DEFAULT_BRANCH --head $branch --title "Raise the package validation baseline to $env:VERSION" --body "Raises ``PackageValidationBaselineVersion`` to the published $env:VERSION (ADR-1007). Opened by .github/workflows/raise-baseline.yml."
          gh workflow run ci.yml --ref $branch
