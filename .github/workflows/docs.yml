name: Documentation site

# Builds the documentation site from docs/site/ with the shared toolchain in NCodeGroup/docs (ADR-1009), on every pull
# request and every push to the default branch, so a page that names a sample key no test defines, or links to a page
# that does not exist, fails here. The build is kept for a week as the github-pages artifact, which a reviewer can
# download and browse. Nothing is published: deploy stays false until #56 turns publishing on, after a repository
# administrator sets Settings > Pages > Source to GitHub Actions and limits the github-pages environment to the default
# branch. The toolchain is pinned by commit, which selects its workflow, packages and theme together.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels the run it supersedes. A run on the default branch is never cancelled once it
# has started.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  site:
    # A called workflow keeps or reduces its caller's permissions, so this job grants what the toolchain's jobs ask
    # for, its deploy job's included, although that job does not run while deploy is false.
    permissions:
      contents: read # checks out this repository
      pages: write # reads the site's URL, and creates the deployment
      id-token: write # proves to GitHub Pages where the deployment comes from
    # Taken the day it is released, not after ADR-0009's cooldown, while the toolchain is built out (ADR-1024).
    uses: NCodeGroup/docs/.github/workflows/site.yml@0dbafce6bf43f8bea0321d62183aa0322fb1c2c3 # v0.13.0
    with:
      content-path: docs/site
      deploy: false
