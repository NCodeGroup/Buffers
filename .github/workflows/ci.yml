name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # A required check must also report in a merge queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or a topic branch cancels the run it supersedes. A run for a default-branch commit or
# a merge queue entry is never cancelled: its group holds its commit SHA, because cancel-in-progress: false alone still
# lets a newer run in the same group cancel a pending one, which would leave that commit without a verdict.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'merge_group') && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'merge_group' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The decision index check compares the records with the default branch, so it needs every branch's history.
          fetch-depth: 0
          persist-credentials: false
      # The SDK global.json selects and the runtime of each older .NET a test project targets.
      - uses: ./.github/actions/install-dotnet
      # No lock file is committed, so setup-dotnet's own cache has no key: this one keys on the restore's inputs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Check the decision index
        run: ./.template/Test-AdrIndex.ps1
      # The gate checks the formatting with CSharpier, then runs the Definition of Done, which builds, tests and, for a library, packs and validates the package (ADR-1002, ADR-1001).
      - name: Definition of Done
        if: hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') != ''
        run: ./build/gate.ps1
      # Fails the build when line or branch coverage drops below build/Test-Coverage.ps1's minimums.
      - name: Code coverage
        if: hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') != ''
        run: ./build/Test-Coverage.ps1 -ReportDirectory artifacts/coverage
      # The Cobertura report, which the codecov job below publishes from a push to the default branch.
      - name: Upload coverage report
        if: hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 14
          if-no-files-found: error
      # A TRX file per test project, kept after a failure too, to see which test failed.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14
          if-no-files-found: ignore
      # The packages a release would publish, to inspect without any publishing permission.
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 14
          if-no-files-found: ignore

  # Publishes the coverage report to Codecov, whose badge the READMEs show, from each push to the default branch. A job
  # of its own, so only it holds an OIDC token, which Codecov takes instead of a stored CODECOV_TOKEN; pull requests
  # never run it. Set up once: the Codecov GitHub App installed for the NCodeGroup organization.
  codecov:
    name: Publish coverage
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # The Codecov CLI lists the repository's files to match the report's paths to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: artifacts/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: artifacts/coverage
          use_oidc: true
          fail_ci_if_error: true
